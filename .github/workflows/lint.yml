name: Lint

# Runs on every PR to main so a malformed cask never merges. Deliberately does
# NOT run on push (including the release automation's direct pushes to main)
# — those pushes only ever touch the version/sha256 fields with values the
# other repo's workflow just computed from files it built and signed itself,
# so there's nothing here for this check to usefully re-verify.
on:
  pull_request:
    branches: [ main ]

jobs:
  cask-lint:
    runs-on: macos-latest
    steps:
      # `brew style`/`brew audit --cask` both refuse to run against a cask
      # file that isn't inside a directory Homebrew recognizes as a tap
      # ("Homebrew requires casks to be in a tap, rejecting"). This action
      # checks the repository out at the exact path Homebrew expects this
      # tap to live at (it auto-detects the tap name from the
      # `homebrew-<name>` repo name) — no separate `actions/checkout` step,
      # and no `brew tap` step either.
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@fd832223f9f99ebf0244dd20658680e5d4aca049 # 2026.08.03.2

      - name: brew style
        run: brew style --cask timebuddy

      - name: brew audit
        run: brew audit --cask --online timebuddy
